name: Video Downloader live smoke

# Upstream sites and yt-dlp change independently of Vorssaint. Check that
# contract weekly, but keep it separate from tag builds so a transient site or
# network failure can never block a release.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-smoke:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Install live-test tools
        run: brew install yt-dlp ffmpeg deno
      - name: Run live downloader contract
        run: zsh Tools/video-downloader-smoke.sh
